<!-- ═══════════════════════════════════════
     FOOTER
═══════════════════════════════════════ -->

<text
  x="600"
  y="450"
  text-anchor="middle"
  fill="#64748b"
  font-family="Arial"
  font-size="12"
  letter-spacing="4">

CODE  •  CREATE  •  LEARN  •  REPEAT

</text>

</g>


<!-- Outer border -->

<rect
  x="1"
  y="1"
  width="1198"
  height="518"
  rx="32"
  fill="none"
  stroke="#334155"
  stroke-width="2"/>

</svg>
