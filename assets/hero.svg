<svg width="1200" height="520" viewBox="0 0 1200 520"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- ═══════════════════════════════════════
       BACKGROUND GRADIENT
  ═══════════════════════════════════════ -->

  <linearGradient id="background"
      x1="0%" y1="0%"
      x2="100%" y2="100%">

    <stop offset="0%" stop-color="#030712"/>

    <stop offset="45%" stop-color="#0b1128">
      <animate
        attributeName="stop-color"
        values="#0b1128;#11104a;#071d35;#0b1128"
        dur="12s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="100%" stop-color="#160b2f">
      <animate
        attributeName="stop-color"
        values="#160b2f;#32115c;#071c3d;#160b2f"
        dur="12s"
        repeatCount="indefinite"/>
    </stop>

  </linearGradient>


  <!-- ═══════════════════════════════════════
       AURORA GRADIENT
  ═══════════════════════════════════════ -->

  <linearGradient id="aurora"
      x1="0%" y1="0%"
      x2="100%" y2="0%">

    <stop offset="0%" stop-color="#00e5ff">
      <animate
        attributeName="stop-color"
        values="#00e5ff;#8b5cf6;#ec4899;#00e5ff"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="50%" stop-color="#8b5cf6">
      <animate
        attributeName="stop-color"
        values="#8b5cf6;#ec4899;#00e5ff;#8b5cf6"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

    <stop offset="100%" stop-color="#ec4899">
      <animate
        attributeName="stop-color"
        values="#ec4899;#00e5ff;#8b5cf6;#ec4899"
        dur="8s"
        repeatCount="indefinite"/>
    </stop>

  </linearGradient>


  <!-- ═══════════════════════════════════════
       GLASS
  ═══════════════════════════════════════ -->

  <linearGradient id="glass"
      x1="0%" y1="0%"
      x2="100%" y2="100%">

    <stop offset="0%"
      stop-color="#ffffff"
      stop-opacity="0.12"/>

    <stop offset="45%"
      stop-color="#ffffff"
      stop-opacity="0.045"/>

    <stop offset="100%"
      stop-color="#ffffff"
      stop-opacity="0.015"/>

  </linearGradient>


  <!-- ═══════════════════════════════════════
       GRID
  ═══════════════════════════════════════ -->

  <pattern id="grid"
      width="45"
      height="45"
      patternUnits="userSpaceOnUse">

    <path
      d="M 45 0 L 0 0 0 45"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.045"
      stroke-width="1"/>

  </pattern>


  <!-- ═══════════════════════════════════════
       GLOW
  ═══════════════════════════════════════ -->

  <filter id="blur">
    <feGaussianBlur stdDeviation="45"/>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="8"/>
  </filter>


  <!-- ═══════════════════════════════════════
       CLIP
  ═══════════════════════════════════════ -->

  <clipPath id="clip">
    <rect
      x="0"
      y="0"
      width="1200"
      height="520"
      rx="32"/>
  </clipPath>

</defs>


<!-- ═══════════════════════════════════════════
     BACKGROUND
═══════════════════════════════════════════ -->

<g clip-path="url(#clip)">

<rect
  width="1200"
  height="520"
  fill="url(#background)"/>


<!-- Aurora glow -->

<ellipse
  cx="220"
  cy="60"
  rx="300"
  ry="150"
  fill="#00e5ff"
  opacity="0.12"
  filter="url(#blur)">

  <animate
    attributeName="cx"
    values="220;360;220"
    dur="10s"
    repeatCount="indefinite"/>

</ellipse>


<ellipse
  cx="1000"
  cy="420"
  rx="330"
  ry="180"
  fill="#8b5cf6"
  opacity="0.15"
  filter="url(#blur)">

  <animate
    attributeName="cy"
    values="420;330;420"
    dur="11s"
    repeatCount="indefinite"/>

</ellipse>


<!-- Pink glow -->

<circle
  cx="880"
  cy="100"
  r="110"
  fill="#ec4899"
  opacity="0.07"
  filter="url(#blur)">

  <animate
    attributeName="r"
    values="110;150;110"
    dur="7s"
    repeatCount="indefinite"/>

</circle>


<!-- Grid -->

<rect
  width="1200"
  height="520"
  fill="url(#grid)"/>


<!-- ═══════════════════════════════════════
     FLOATING PARTICLES
═══════════════════════════════════════ -->

<g fill="#67e8f9">

  <circle cx="100" cy="180" r="2">
    <animate
      attributeName="cy"
      values="180;145;180"
      dur="4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1080" cy="180" r="2">
    <animate
      attributeName="cy"
      values="180;220;180"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="320" r="1.5">
    <animate
      attributeName="cy"
      values="320;285;320"
      dur="3s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="160" cy="380" r="1.5">
    <animate
      attributeName="cy"
      values="380;410;380"
      dur="5s"
      repeatCount="indefinite"/>
  </circle>

</g>


<!-- ═══════════════════════════════════════
     GLASS CARD
═══════════════════════════════════════ -->

<rect
  x="45"
  y="35"
  width="1110"
  height="450"
  rx="30"
  fill="url(#glass)"
  stroke="#ffffff"
  stroke-opacity="0.13"
  stroke-width="1"/>


<!-- Animated neon border -->

<rect
  x="45"
  y="35"
  width="1110"
  height="450"
  rx="30"
  fill="none"
  stroke="url(#aurora)"
  stroke-width="2"
  opacity="0.8">

  <animate
    attributeName="stroke-opacity"
    values="0.35;0.9;0.35"
    dur="4s"
    repeatCount="indefinite"/>

</rect>


<!-- ═══════════════════════════════════════
     TOP STATUS
═══════════════════════════════════════ -->

<circle
  cx="88"
  cy="82"
  r="6"
  fill="#22c55e">

  <animate
    attributeName="opacity"
    values="0.3;1;0.3"
    dur="2s"
    repeatCount="indefinite"/>

</circle>


<text
  x="105"
  y="88"
  fill="#94a3b8"
  font-family="Arial, Helvetica, sans-serif"
  font-size="14"
  letter-spacing="2">

AVAILABLE TO BUILD

</text>


<!-- ═══════════════════════════════════════
     DECORATIVE WINDOW BUTTONS
═══════════════════════════════════════ -->

<circle cx="1085" cy="78" r="5"
fill="#ef4444" opacity="0.7"/>

<circle cx="1105" cy="78" r="5"
fill="#eab308" opacity="0.7"/>

<circle cx="1125" cy="78" r="5"
fill="#22c55e" opacity="0.7"/>


<!-- ═══════════════════════════════════════
     MAIN NAME
═══════════════════════════════════════ -->

<text
  x="600"
  y="190"
  text-anchor="middle"
  fill="#ffffff"
  font-family="Arial, Helvetica, sans-serif"
  font-size="62"
  font-weight="700">

Sushant Kumar

</text>


<!-- Gradient underline -->

<rect
  x="475"
  y="210"
  width="250"
  height="3"
  rx="2"
  fill="url(#aurora)">

  <animate
    attributeName="width"
    values="180;250;180"
    dur="4s"
    repeatCount="indefinite"/>

</rect>


<!-- ═══════════════════════════════════════
     ROLE
═══════════════════════════════════════ -->

<text
  x="600"
  y="260"
  text-anchor="middle"
  fill="#67e8f9"
  font-family="Arial, Helvetica, sans-serif"
  font-size="23"
  font-weight="600"
  letter-spacing="4">

FULL STACK DEVELOPER

</text>


<!-- ═══════════════════════════════════════
     DESCRIPTION
═══════════════════════════════════════ -->

<text
  x="600"
  y="305"
  text-anchor="middle"
  fill="#cbd5e1"
  font-family="Arial, Helvetica, sans-serif"
  font-size="18">

Building scalable applications, developer tools,

</text>

<text
  x="600"
  y="333"
  text-anchor="middle"
  fill="#cbd5e1"
  font-family="Arial, Helvetica, sans-serif"
  font-size="18">

and AI-powered solutions for real-world problems.

</text>


