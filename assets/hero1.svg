<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

<defs>

  <linearGradient id="bg"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%">

    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#1e0b3d"/>

    <animate
      attributeName="x1"
      values="0%;30%;0%"
      dur="12s"
      repeatCount="indefinite"/>

  </linearGradient>

  <linearGradient id="accent"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="0%">

    <stop offset="0%" stop-color="#22d3ee"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#ec4899"/>

    <animate
      attributeName="x1"
      values="0%;100%;0%"
      dur="8s"
      repeatCount="indefinite"/>

  </linearGradient>

  <pattern id="grid"
           width="40"
           height="40"
           patternUnits="userSpaceOnUse">

    <path
      d="M40 0H0V40"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.045"
      stroke-width="1"/>

  </pattern>

</defs>


<!-- BACKGROUND -->

<rect
  width="1200"
  height="500"
  rx="28"
  fill="url(#bg)"/>


<!-- GLOWING AURORA -->

<ellipse
  cx="150"
  cy="50"
  rx="280"
  ry="120"
  fill="#06b6d4"
  opacity="0.12">

  <animate
    attributeName="cx"
    values="150;350;150"
    dur="10s"
    repeatCount="indefinite"/>

</ellipse>


<ellipse
  cx="1050"
  cy="430"
  rx="300"
  ry="150"
  fill="#8b5cf6"
  opacity="0.14">

  <animate
    attributeName="cx"
    values="1050;900;1050"
    dur="12s"
    repeatCount="indefinite"/>

</ellipse>


<!-- GRID -->

<rect
  width="1200"
  height="500"
