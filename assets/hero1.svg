    fill="#818cf8">

    <animate
      attributeName="cy"
      values="390;420;390"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- =====================================================
       NETWORK LINES
  ====================================================== -->

  <g
    stroke="url(#neon)"
    stroke-width="1"
    stroke-opacity="0.20">

    <line
      x1="75"
      y1="120"
      x2="190"
      y2="180"/>

    <line
      x1="190"
      y1="180"
      x2="110"
      y2="310"/>

    <line
      x1="1070"
      y1="120"
      x2="950"
      y2="190"/>

    <line
      x1="950"
      y1="190"
      x2="1090"
      y2="320"/>

    <line
      x1="1090"
      y1="320"
      x2="1000"
      y2="430"/>

  </g>


  <!-- Network nodes -->

  <circle
    cx="75"
    cy="120"
    r="3"
    fill="#22d3ee">

    <animate
      attributeName="r"
      values="2;5;2"
      dur="3s"
      repeatCount="indefinite"/>

