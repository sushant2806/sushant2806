<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="500"
     viewBox="0 0 1200 500">

  <defs>

    <!-- Background -->
    <linearGradient id="bg"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e0b3d"/>

      <animate
        attributeName="x1"
        values="0%;25%;0%"
        dur="12s"
        repeatCount="indefinite"/>
    </linearGradient>


    <!-- Neon gradient -->
    <linearGradient id="neon"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%" stop-color="#22d3ee">
        <animate
          attributeName="stop-color"
          values="#22d3ee;#818cf8;#c084fc;#22d3ee"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="50%" stop-color="#8b5cf6">
        <animate
          attributeName="stop-color"
          values="#8b5cf6;#ec4899;#22d3ee;#8b5cf6"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

      <stop offset="100%" stop-color="#ec4899">
        <animate
          attributeName="stop-color"
          values="#ec4899;#22d3ee;#818cf8;#ec4899"
          dur="8s"
          repeatCount="indefinite"/>
      </stop>

    </linearGradient>


    <!-- Grid -->
    <pattern id="grid"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">

      <path
        d="M40 0H0V40"
        fill="none"
        stroke="#94a3b8"
        stroke-opacity="0.045"
        stroke-width="1"/>

    </pattern>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect
    width="1200"
    height="500"
    rx="28"
    fill="url(#bg)"/>


  <!-- =====================================================
       AURORA GLOW
  ====================================================== -->

  <ellipse
    cx="160"
    cy="55"
    rx="290"
    ry="135"
    fill="#06b6d4"
    opacity="0.13">

    <animate
      attributeName="cx"
      values="160;350;160"
      dur="10s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="55;95;55"
      dur="10s"
      repeatCount="indefinite"/>

  </ellipse>


  <ellipse
    cx="1040"
    cy="430"
    rx="320"
    ry="160"
    fill="#8b5cf6"
    opacity="0.15">

    <animate
      attributeName="cx"
      values="1040;890;1040"
      dur="12s"
      repeatCount="indefinite"/>

    <animate
      attributeName="cy"
      values="430;370;430"
      dur="12s"
      repeatCount="indefinite"/>

  </ellipse>


  <circle
    cx="850"
    cy="90"
    r="100"
    fill="#ec4899"
    opacity="0.055">

    <animate
      attributeName="r"
      values="100;135;100"
      dur="7s"
      repeatCount="indefinite"/>

  </circle>


  <!-- =====================================================
       GRID
  ====================================================== -->

  <rect
    width="1200"
    height="500"
    fill="url(#grid)"/>


  <!-- =====================================================
       FLOATING PARTICLES
  ====================================================== -->

  <circle
    cx="105"
    cy="170"
    r="2"
    fill="#67e8f9">

    <animate
      attributeName="cy"
      values="170;135;170"
      dur="4s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="315"
    cy="95"
    r="1.5"
    fill="#c084fc">

    <animate
      attributeName="cy"
      values="95;65;95"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1080"
    cy="180"
    r="2"
    fill="#67e8f9">

    <animate
      attributeName="cy"
      values="180;215;180"
      dur="5s"
      repeatCount="indefinite"/>

    <animate
      attributeName="opacity"
      values="0.2;1;0.2"
      dur="5s"
      repeatCount="indefinite"/>

  </circle>


  <circle
    cx="1030"
    cy="350"
    r="1.5"
    fill="#ec4899">

    <animate
